name: Build and push Docker images for CardioMechanics and its dependencies

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: set image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY@L}" >> ${GITHUB_ENV}
        
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Extract metadata (tags, labels) for main Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      
      - name: Build and push PETSc Docker image
        id: push-petsc
        uses: docker/build-push-action@v5
        with:
          file: ./docker/Dockerfile-thirdparty-petsc
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/thirdparty-petsc
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/thirdparty-petsc:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/thirdparty-petsc:buildcache,mode=max
          push: true

      - name: Build and push main Docker image
        id: push-main
        uses: docker/build-push-action@v5
        with:
          file: ./docker/Dockerfile
          build-args: |
            PETSC_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/thirdparty-petsc
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          push: true

  tests-in-container:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.build-and-push-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set up Python environment
        run: |
          apt update
          apt install -y python3-venv
          cd /CardioMechanics
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r tests/requirements.txt
          export CM_BIN_DIR=/CardioMechanics/_build/release/bin
          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
          mkdir -p ~/.openmpi && echo 'hwloc_base_use_hwthreads_as_cpus = 1' >> ~/.openmpi/mca-params.conf
          python -m pytest tests/
